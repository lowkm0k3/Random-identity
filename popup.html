<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Random Identity</h1>

  <label for="username">Username</label>
  <div class="row">
    <input id="username" type="text" readonly>
    <button id="copyUser" class="copy" title="Copy username">⧉</button>
  </div>

  <label for="password">Password</label>
  <div class="row">
    <input id="password" type="text" readonly>
    <button id="copyPass" class="copy" title="Copy password">⧉</button>
  </div>

  <div class="options">
    <label class="span2">Length
      <input id="len" type="number" min="8" max="64" value="20">
    </label>
    <label><input id="digits" type="checkbox" checked> Digits</label>
    <label><input id="symbols" type="checkbox" checked> Symbols</label>
  </div>

  <button id="generate" class="primary">Generate new</button>
  <div id="status" role="status"></div>

  <script src="generator.js"></script>
  <script src="popup.js"></script>
</body>
</html>
